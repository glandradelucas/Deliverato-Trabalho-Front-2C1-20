<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante - Deliverato</title>
    <link rel="icon" href="img/deliverato-logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="topo"></div>
    <main id="paginaRestaurante">
        <section class="banner-restaurante">
            <img id="bannerLogo" src="" alt="">
        </section>
        <section class="info-restaurante">
            <div class="container">
                <div class="identidade">
                    <div class="mini-logo"><img id="miniLogo" src="" alt=""></div>
                    <div>
                        <h1 id="nomeRestaurante"></h1>
                        <div class="nota"><span class="estrela">★</span> <span id="notaRestaurante"></span></div>
                        <p class="detalhes" id="detalhesRestaurante"></p>
                    </div>
                </div>
                <p class="descricao" id="descricaoRestaurante"></p>
            </div>
        </section>
        <section class="container">
            <div class="grade-produtos" id="gradeProdutos"></div>
        </section>
    </main>
    <div id="rodape"></div>
    <script src="js/dados.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
